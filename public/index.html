
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#9bd8ff">
<title>FREEEZER MD · Link your WhatsApp</title>

<style>
:root {
  --bg: #a9ddfa;
  --card: rgba(255,255,255,.23);
  --fg: #102e4b;
  --mut: #496b87;
  --acc: #299ce9;
  --ok: #19b978;
  --bad: #ff646e;
  --line: rgba(255,255,255,.48);
  --shadow: 0 12px 40px rgba(23,83,130,.15);
}

* {
  box-sizing: border-box;
  margin: 0;
  -webkit-tap-highlight-color: transparent;
}

html {
  min-height: 100%;
  scroll-behavior: smooth;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  background:
    linear-gradient(145deg, rgba(115,193,247,.42), rgba(222,244,255,.35)),
    url('https://i.ibb.co/hJCNNHMh/5185b12441e384deb8ab12d1686e6705.jpg');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  background-repeat: no-repeat;
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
    "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  padding: max(28px, env(safe-area-inset-top)) 18px
           max(28px, env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  position: relative;
  overflow-x: hidden;
}

/* Soft blue atmosphere */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    linear-gradient(180deg,
      rgba(210,239,255,.34),
      rgba(105,180,235,.18),
      rgba(225,245,255,.34));
  pointer-events: none;
  z-index: -1;
}

/* Glass cards */
.card {
  width: 100%;
  max-width: 440px;
  position: relative;
  overflow: hidden;
  padding: 26px 23px;
  border-radius: 28px;
  background: rgba(255,255,255,.34);
  border: 1px solid rgba(255,255,255,.65);
  backdrop-filter: blur(28px) saturate(175%);
  -webkit-backdrop-filter: blur(28px) saturate(175%);
  box-shadow:
    0 15px 45px rgba(35,104,158,.15),
    inset 0 1px 1px rgba(255,255,255,.65);
  animation: appear .65s ease both;
}

.card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 12%;
  width: 76%;
  height: 1px;
  background: rgba(255,255,255,.9);
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(18px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

h1 {
  font-size: 1.55rem;
  font-weight: 800;
  letter-spacing: -.7px;
  color: #123b60;
  margin-bottom: 8px;
}

p.s {
  color: var(--mut);
  font-size: .91rem;
  line-height: 1.55;
  margin-bottom: 20px;
}

input {
  width: 100%;
  padding: 15px 16px;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,.8);
  background: rgba(255,255,255,.48);
  color: #153d60;
  font-size: 1rem;
  font-family: inherit;
  margin-bottom: 13px;
  outline: none;
  transition: .25s ease;
  box-shadow: inset 0 2px 5px rgba(36,112,165,.04);
}

input::placeholder {
  color: #7392aa;
}

input:focus {
  border-color: #48aef1;
  background: rgba(255,255,255,.75);
  box-shadow: 0 0 0 4px rgba(41,156,233,.13);
}

button {
  width: 100%;
  padding: 15px;
  border: 1px solid rgba(255,255,255,.38);
  border-radius: 16px;
  background: linear-gradient(135deg, #53baff, #2189dc);
  color: white;
  font-weight: 750;
  font-size: 1rem;
  font-family: inherit;
  cursor: pointer;
  box-shadow:
    0 7px 18px rgba(35,139,216,.25),
    inset 0 1px 1px rgba(255,255,255,.5);
  transition: transform .2s ease, filter .2s ease;
}

button:active {
  transform: scale(.97);
}

button:disabled {
  opacity: .55;
  cursor: not-allowed;
}

button.sm {
  width: auto;
  padding: 8px 12px;
  font-size: .76rem;
  margin-left: 4px;
  border-radius: 10px;
  background: rgba(255,255,255,.48);
  border: 1px solid rgba(255,255,255,.75);
  color: #16466b;
  box-shadow: none;
}

#code {
  font-size: 2.2rem;
  letter-spacing: .2em;
  text-align: center;
  margin: 20px 0 7px;
  font-weight: 850;
  color: #087cbe;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 2px 12px rgba(41,156,233,.15);
  word-break: break-word;
}

#msg {
  font-size: .88rem;
  text-align: center;
  color: #416783;
  min-height: 1.5em;
  line-height: 1.5;
}

ol {
  padding-left: 22px;
  color: #345c79;
  font-size: .87rem;
  line-height: 1.9;
  margin-top: 21px;
}

ol li {
  padding-left: 3px;
}

ol b {
  color: #146da8;
}

details summary {
  cursor: pointer;
  color: #16466b;
  font-size: .96rem;
  font-weight: 750;
  list-style: none;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

details summary::-webkit-details-marker {
  display: none;
}

details summary::after {
  content: "+";
  font-size: 1.35rem;
  color: #258fd5;
  font-weight: 400;
}

details[open] summary::after {
  content: "−";
}

.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  padding: 12px 0;
  border-top: 1px solid rgba(255,255,255,.6);
  font-size: .83rem;
  color: #214b6c;
}

.row > span {
  min-width: 0;
}

.row > span:first-child {
  overflow-wrap: anywhere;
}

.dot {
  display: inline-block;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  margin-right: 7px;
  background: var(--bad);
  box-shadow: 0 0 8px rgba(255,100,110,.35);
}

.dot.open {
  background: var(--ok);
  box-shadow: 0 0 8px rgba(25,185,120,.4);
}

#sum {
  line-height: 1.6;
}

#list {
  margin-top: 8px;
}

#adm input {
  margin-top: 15px;
}

@media(max-width:380px) {
  body {
    padding-left: 12px;
    padding-right: 12px;
  }

  .card {
    padding: 22px 17px;
    border-radius: 23px;
  }

  #code {
    font-size: 1.8rem;
  }

  .row {
    font-size: .76rem;
  }

  button.sm {
    padding: 7px 8px;
  }
}

@media(prefers-reduced-motion:reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>

<div class="card">
  <h1>Link your WhatsApp</h1>
  <p class="s">
    Get your own bot in under a minute.
    Enter your number with country code, no "+".
  </p>

  <input id="num" inputmode="numeric"
    placeholder="254712345678" autocomplete="tel">

  <button id="go">Get pairing code</button>

  <div id="code"></div>
  <div id="msg"></div>

  <ol>
    <li>Open WhatsApp → <b>Linked devices</b></li>
    <li>Tap <b>Link with phone number instead</b></li>
    <li>Enter the code above</li>
  </ol>
</div>

<div class="card">
  <details id="adm">
    <summary>Admin dashboard</summary>

    <input id="tok" type="password" placeholder="Admin token"
      style="margin-top:15px">

    <button id="load">Load sessions</button>

    <div id="sum"
      style="margin:12px 0 4px;color:var(--mut);font-size:.85rem">
    </div>

    <div id="list"></div>
  </details>
</div>

<script>
const $=id=>document.getElementById(id);

$('go').onclick=async()=>{
  const number=$('num').value.replace(/\D/g,'');
  if(number.length<8){
    $('msg').textContent='Enter a valid number.';
    return
  }

  $('go').disabled=true;
  $('code').textContent='';
  $('msg').textContent='Requesting code…';

  try{
    const r=await fetch('/api/pair',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({number})
    });

    const d=await r.json();

    if(d.code){
      $('code').textContent=d.code;
      $('msg').textContent='Enter this code in WhatsApp within a minute.';
      poll(number)
    }
    else $('msg').textContent=d.error||('Status: '+d.status)

  }
  catch(e){
    $('msg').textContent='Network error, try again.'
  }

  $('go').disabled=false
};

function poll(number){
  let n=0;

  const t=setInterval(async()=>{
    n++;

    try{
      const d=await (await fetch('/status?number='+number)).json();

      if(d.isConnected){
        clearInterval(t);
        $('code').textContent='✅';
        $('msg').textContent='Connected! Check your WhatsApp “Message yourself” chat.'
      }
    }catch{}

    if(n>60)clearInterval(t)

  },3000)
}

async function api(path,method='GET'){
  const r=await fetch(path,{
    method,
    headers:{'x-admin-token':$('tok').value}
  });
  return r.json()
}

async function load(){
  const d=await api('/api/sessions');

  if(d.error){
    $('sum').textContent=d.error;
    $('list').innerHTML='';
    return
  }

  const s=d.summary;

  $('sum').textContent=
    `${s.connected}/${s.total} connected · max ${s.max} · ${s.memoryMB} MB RAM`;

  $('list').innerHTML=d.sessions.map(x=>`
    <div class="row">
      <span>
        <span class="dot ${x.status==='open'?'open':''}"></span>
        ${x.number}
        <small style="color:var(--mut)">${x.status}</small>
      </span>

      <span>
        <button class="sm" data-a="restart" data-n="${x.number}">restart</button>
        <button class="sm" data-a="del" data-n="${x.number}">logout</button>
      </span>
    </div>
  `).join('')||'<p class="s">No sessions yet.</p>'
}

$('load').onclick=load;

$('list').onclick=async e=>{
  const b=e.target.closest('button');
  if(!b)return;

  const n=b.dataset.n;

  if(b.dataset.a==='del'){
    if(!confirm('Log out and delete '+n+'?'))return;
    await api('/api/sessions/'+n,'DELETE')
  }
  else await api('/api/sessions/'+n+'/restart','POST');

  setTimeout(load,800)
};
</script>

</body>
</html>
